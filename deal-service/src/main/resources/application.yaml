server:
  port: 8081

spring:
  application:
    name: deal-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/accrual_platform}
    username: ${DB_USERNAME:accrual_app}
    password: ${DB_PASSWORD:LocalDevPassword123!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.dealservice: INFO